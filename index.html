<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多网盘索引管理系统</title>
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Lucide 图标库 -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

    <!-- 页头标题与顶栏操作 -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-3">
          <i data-lucide="hard-drive" class="w-8 h-8 text-indigo-600"></i>
          多网盘索引管理系统
        </h1>
        <p class="text-slate-500 mt-1 text-sm">统一追踪、搜索与管理多网盘文件分布与结构</p>
      </div>

      <!-- 右侧按钮组：设置按钮 + 新增下拉控件 -->
      <div class="flex items-center gap-3">
        <!-- 设置按钮 -->
        <button onclick="openModal('settingsModal')" class="p-2.5 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition-all shadow-sm" title="设置">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>

        <!-- 下拉组控件 -->
        <div class="relative">
          <button id="addDropdownBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-lg shadow-sm flex items-center gap-2 transition-all">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>添加</span>
            <i data-lucide="chevron-down" class="w-4 h-4 ml-1"></i>
          </button>

          <!-- 下拉菜单 -->
          <div id="addDropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-100 py-1.5 z-20">
            <button onclick="openDriveModal()" class="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-2.5">
              <i data-lucide="hard-drive" class="w-4 h-4 text-indigo-500"></i>
              添加网盘
            </button>
            <button onclick="openFolderModal()" class="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-2.5">
              <i data-lucide="folder-plus" class="w-4 h-4 text-indigo-500"></i>
              添加文件夹
            </button>

            <hr class="my-1 border-slate-100">
            
            <button onclick="openFileModal()" class="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-2.5">
              <i data-lucide="file-plus-2" class="w-4 h-4 text-indigo-500"></i>
              添加文件
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 页面切换导航栏 -->
    <nav class="flex gap-2 border-b border-slate-200 mb-6">
      <button id="tabFilesBtn" onclick="switchTab('files')" class="pb-3 px-4 font-semibold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2 transition-all">
        <i data-lucide="files" class="w-4 h-4"></i>
        <span>文件列表</span>
      </button>
      <button id="tabDrivesBtn" onclick="switchTab('drives')" class="pb-3 px-4 font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-2 transition-all">
        <i data-lucide="hard-drive-upload" class="w-4 h-4"></i>
        <span>网盘管理</span>
      </button>
    </nav>

    <!-- 视图 1：文件列表视图 -->
    <div id="viewFiles" class="space-y-6">
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="p-4 sm:p-6 border-b border-slate-100 flex flex-col sm:flex-row gap-4 items-center justify-between">
          <div class="relative w-full sm:w-96">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="searchInput" oninput="renderFiles()" placeholder="输入文件名搜索..." class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all" />
          </div>
        </div>

        <!-- 表格区域 -->
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50/70 border-b border-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <th class="py-3.5 px-6">文件名称</th>
                <th class="py-3.5 px-6">文件分类</th>
                <th class="py-3.5 px-6">容量体积</th>
                <th class="py-3.5 px-6">存储位置</th>
                <th class="py-3.5 px-6 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="fileTableBody" class="divide-y divide-slate-100 text-sm">
              <!-- 动态渲染内容 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 视图 2：网盘管理视图 -->
    <div id="viewDrives" class="hidden space-y-6">
      <!-- 概览仪表盘（已搬迁至此页面） -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4">
          <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl">
            <i data-lucide="hard-drive" class="w-6 h-6"></i>
          </div>
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">已注册网盘</p>
            <h3 id="statDrives" class="text-2xl font-bold text-slate-800 mt-0.5">0 个</h3>
          </div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4">
          <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl">
            <i data-lucide="file-text" class="w-6 h-6"></i>
          </div>
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">已索引文件</p>
            <h3 id="statFiles" class="text-2xl font-bold text-slate-800 mt-0.5">0 个</h3>
          </div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4">
          <div class="p-3 bg-amber-50 text-amber-600 rounded-xl">
            <i data-lucide="pie-chart" class="w-6 h-6"></i>
          </div>
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">统计体积</p>
            <h3 id="statSize" class="text-2xl font-bold text-slate-800 mt-0.5">0 B</h3>
          </div>
        </div>
      </div>

      <!-- 已注册网盘列表卡片 -->
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="p-4 sm:p-6 border-b border-slate-100 flex items-center justify-between">
          <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="server" class="w-5 h-5 text-indigo-600"></i>
            网盘列表
          </h2>
          <button onclick="openDriveModal()" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-medium text-xs rounded-lg transition-all flex items-center gap-1">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            新增网盘
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50/70 border-b border-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <th class="py-3.5 px-6">网盘名称</th>
                <th class="py-3.5 px-6">文件夹数量</th>
                <th class="py-3.5 px-6">关联文件数</th>
                <th class="py-3.5 px-6 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="driveTableBody" class="divide-y divide-slate-100 text-sm">
              <!-- 动态渲染网盘列表 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 模态框：设置弹窗 -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="settings" class="w-5 h-5 text-indigo-600"></i>
          系统设置
        </h3>
        <button onclick="closeModal('settingsModal')" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1.5">文件后缀名管理</label>
          <select id="extManagementSelect" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 bg-white">
            <option value="auto">自动识别扩展名 (默认)</option>
            <option value="custom">自定义映射分类 (预留功能)</option>
            <option value="ignore">忽略无扩展名文件 (预留功能)</option>
          </select>
          <p class="text-xs text-slate-400 mt-1.5">说明：此下拉选项为预留界面控件，暂时不含实际功能。</p>
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeModal('settingsModal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition-all">关闭</button>
      </div>
    </div>
  </div>

  <!-- 模态框 1：添加/编辑网盘 -->
  <div id="driveModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <h3 id="driveModalTitle" class="text-xl font-bold text-slate-900 mb-4">添加网盘</h3>
      <input type="hidden" id="editDriveId">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">网盘名称</label>
          <input type="text" id="driveNameInput" placeholder="例: Google Drive #1" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeModal('driveModal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
        <button onclick="saveDrive()" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm">保存</button>
      </div>
    </div>
  </div>

  <!-- 模态框 2：添加文件夹 -->
  <div id="folderModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <h3 class="text-xl font-bold text-slate-900 mb-4">添加文件夹</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">选择目标网盘</label>
          <select id="folderDriveSelect" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 bg-white"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">父级文件夹 (可选根目录)</label>
          <select id="folderParentSelect" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 bg-white"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">新文件夹名称</label>
          <input type="text" id="folderNameInput" placeholder="例: documents" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeModal('folderModal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
        <button onclick="saveFolder()" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm">保存</button>
      </div>
    </div>
  </div>

  <!-- 模态框 3：添加/编辑文件 -->
  <div id="fileModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <h3 id="fileModalTitle" class="text-xl font-bold text-slate-900 mb-4">添加文件</h3>
      <input type="hidden" id="editFileId">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">文件名称 (含后缀)</label>
          <input type="text" id="fileNameInput" placeholder="例: report.pdf" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">文件体积 (KB/MB/GB/TB)</label>
          <input type="text" id="fileSizeInput" placeholder="例: 15.5 MB" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">所属网盘</label>
          <select id="fileDriveSelect" onchange="updateFileFolderOptions()" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 bg-white"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">存放路径</label>
          <select id="fileFolderSelect" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 bg-white"></select>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeModal('fileModal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
        <button onclick="saveFile()" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm">保存</button>
      </div>
    </div>
  </div>

  <script>
    // 数据持久化中心
    let drives = JSON.parse(localStorage.getItem('mc_drives_v2')) || [];
    let folders = JSON.parse(localStorage.getItem('mc_folders_v2')) || [];
    let files = JSON.parse(localStorage.getItem('mc_files_v2')) || [];

    // 初始化运行
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderStats();
      renderFiles();
      renderDrives();
      initDropdown();
    });

    // Tab 页面切换逻辑
    function switchTab(tab) {
      const viewFiles = document.getElementById('viewFiles');
      const viewDrives = document.getElementById('viewDrives');
      const tabFilesBtn = document.getElementById('tabFilesBtn');
      const tabDrivesBtn = document.getElementById('tabDrivesBtn');

      if (tab === 'files') {
        viewFiles.classList.remove('hidden');
        viewDrives.classList.add('hidden');

        tabFilesBtn.className = 'pb-3 px-4 font-semibold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2 transition-all';
        tabDrivesBtn.className = 'pb-3 px-4 font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-2 transition-all';
      } else {
        viewFiles.classList.add('hidden');
        viewDrives.classList.remove('hidden');

        tabDrivesBtn.className = 'pb-3 px-4 font-semibold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2 transition-all';
        tabFilesBtn.className = 'pb-3 px-4 font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-2 transition-all';
      }
      lucide.createIcons();
    }

    // 存储更新
    function syncStorage() {
      localStorage.setItem('mc_drives_v2', JSON.stringify(drives));
      localStorage.setItem('mc_folders_v2', JSON.stringify(folders));
      localStorage.setItem('mc_files_v2', JSON.stringify(files));
      renderStats();
      renderFiles();
      renderDrives();
    }

    // 初始化控件与事件
    function initDropdown() {
      const btn = document.getElementById('addDropdownBtn');
      const menu = document.getElementById('addDropdownMenu');

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('hidden');
      });

      document.addEventListener('click', () => {
        menu.classList.add('hidden');
      });
    }

    // 后缀名自动分析
    function getFileCategory(filename) {
      if (!filename) return 'file';
      const parts = filename.split('.');
      if (parts.length > 1 && parts[parts.length - 1].trim() !== '') {
        return `${parts[parts.length - 1].toLowerCase()} file`;
      }
      return 'unknown file';
    }

    // 容量单位解析计算
    function parseSizeToBytes(sizeStr) {
      if (!sizeStr) return 0;
      const match = sizeStr.trim().match(/^([\d.]+)\s*([a-zA-Z]+)?$/);
      if (!match) return 0;
      const val = parseFloat(match[1]);
      const unit = (match[2] || 'B').toUpperCase();
      const units = { B: 1, KB: 1024, MB: 1024**2, GB: 1024**3, TB: 1024**4 };
      return val * (units[unit] || 1);
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // 路径递归计算
    function getFolderPath(folderId) {
      const folder = folders.find(f => f.id === folderId);
      if (!folder) return '';
      if (folder.parentId) {
        return getFolderPath(folder.parentId) + '/' + folder.name;
      }
      return folder.name;
    }

    function getFullFilePath(file) {
      const drive = drives.find(d => d.id === file.driveId);
      const driveName = drive ? drive.name : 'Unknown Drive';
      if (!file.folderId) return `${driveName}/`;
      const subPath = getFolderPath(file.folderId);
      return `${driveName}/${subPath}`;
    }

    // 渲染统计指标
    function renderStats() {
      document.getElementById('statDrives').innerText = `${drives.length} 个`;
      document.getElementById('statFiles').innerText = `${files.length} 个`;
      
      const totalBytes = files.reduce((acc, f) => acc + parseSizeToBytes(f.size), 0);
      document.getElementById('statSize').innerText = formatBytes(totalBytes);
    }

    // 渲染主表格 (文件)
    function renderFiles() {
      const tbody = document.getElementById('fileTableBody');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = files.filter(f => f.name.toLowerCase().includes(search));

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-12 text-center text-slate-400">
              <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 stroke-1"></i>
              <p>暂无数据文件</p>
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = filtered.map(file => {
        const category = getFileCategory(file.name);
        const fullPath = getFullFilePath(file);
        return `
          <tr class="hover:bg-slate-50/80 transition-colors">
            <td class="py-4 px-6 font-medium text-slate-800">${file.name}</td>
            <td class="py-4 px-6">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100/50">
                ${category}
              </span>
            </td>
            <td class="py-4 px-6 text-slate-600">${file.size || '-'}</td>
            <td class="py-4 px-6 font-mono text-xs text-slate-500">${fullPath}</td>
            <td class="py-4 px-6 text-right space-x-2">
              <button onclick="openFileModal('${file.id}')" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-500 hover:text-indigo-600">
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button onclick="deleteFile('${file.id}')" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-500 hover:text-rose-600">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
    }

    // 渲染网盘列表视图
    function renderDrives() {
      const tbody = document.getElementById('driveTableBody');
      if (drives.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="py-12 text-center text-slate-400">
              <i data-lucide="hard-drive" class="w-10 h-10 mx-auto mb-2 stroke-1"></i>
              <p>暂无已注册网盘，点击右上角加号可进行添加</p>
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = drives.map(drive => {
        const folderCount = folders.filter(f => f.driveId === drive.id).length;
        const fileCount = files.filter(f => f.driveId === drive.id).length;
        return `
          <tr class="hover:bg-slate-50/80 transition-colors">
            <td class="py-4 px-6 font-semibold text-slate-800 flex items-center gap-2">
              <i data-lucide="hard-drive" class="w-4 h-4 text-indigo-500"></i>
              ${drive.name}
            </td>
            <td class="py-4 px-6 text-slate-600">${folderCount} 个文件夹</td>
            <td class="py-4 px-6 text-slate-600">${fileCount} 个文件</td>
            <td class="py-4 px-6 text-right">
              <button onclick="deleteDrive('${drive.id}')" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-500 hover:text-rose-600" title="删除网盘">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
    }

    // 模态框统一控制
    function openModal(id) { 
      document.getElementById(id).classList.remove('hidden'); 
      lucide.createIcons();
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // 网盘逻辑
    function openDriveModal() {
      document.getElementById('driveNameInput').value = '';
      openModal('driveModal');
    }
    function saveDrive() {
      const name = document.getElementById('driveNameInput').value.trim();
      if (!name) return alert('请输入网盘名称');
      drives.push({ id: Date.now().toString(), name });
      syncStorage();
      closeModal('driveModal');
    }
    function deleteDrive(id) {
      if (confirm('删除网盘将同时清理涉及该网盘的文件与文件夹索引，确认删除吗？')) {
        drives = drives.filter(d => d.id !== id);
        folders = folders.filter(f => f.driveId !== id);
        files = files.filter(f => f.driveId !== id);
        syncStorage();
      }
    }

    // 文件夹逻辑
    function openFolderModal() {
      if (drives.length === 0) return alert('请先添加网盘');
      
      const driveSelect = document.getElementById('folderDriveSelect');
      driveSelect.innerHTML = drives.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
      
      updateFolderParentOptions();
      driveSelect.onchange = updateFolderParentOptions;

      document.getElementById('folderNameInput').value = '';
      openModal('folderModal');
    }

    function updateFolderParentOptions() {
      const driveId = document.getElementById('folderDriveSelect').value;
      const parentSelect = document.getElementById('folderParentSelect');
      const driveFolders = folders.filter(f => f.driveId === driveId);
      
      parentSelect.innerHTML = `<option value="">根目录 (无父级)</option>` + 
        driveFolders.map(f => `<option value="${f.id}">${getFolderPath(f.id)}</option>`).join('');
    }

    function saveFolder() {
      const driveId = document.getElementById('folderDriveSelect').value;
      const parentId = document.getElementById('folderParentSelect').value || null;
      const name = document.getElementById('folderNameInput').value.trim();
      if (!name) return alert('请输入文件夹名称');

      folders.push({ id: Date.now().toString(), driveId, parentId, name });
      syncStorage();
      closeModal('folderModal');
    }

    // 文件逻辑
    function openFileModal(fileId = null) {
      if (drives.length === 0) return alert('请先添加网盘');

      const driveSelect = document.getElementById('fileDriveSelect');
      driveSelect.innerHTML = drives.map(d => `<option value="${d.id}">${d.name}</option>`).join('');

      if (fileId) {
        const file = files.find(f => f.id === fileId);
        document.getElementById('fileModalTitle').innerText = '编辑文件';
        document.getElementById('editFileId').value = file.id;
        document.getElementById('fileNameInput').value = file.name;
        document.getElementById('fileSizeInput').value = file.size;
        driveSelect.value = file.driveId;
        updateFileFolderOptions();
        document.getElementById('fileFolderSelect').value = file.folderId || '';
      } else {
        document.getElementById('fileModalTitle').innerText = '添加文件';
        document.getElementById('editFileId').value = '';
        document.getElementById('fileNameInput').value = '';
        document.getElementById('fileSizeInput').value = '';
        updateFileFolderOptions();
      }

      openModal('fileModal');
    }

    function updateFileFolderOptions() {
      const driveId = document.getElementById('fileDriveSelect').value;
      const folderSelect = document.getElementById('fileFolderSelect');
      const driveFolders = folders.filter(f => f.driveId === driveId);

      folderSelect.innerHTML = `<option value="">根目录</option>` + 
        driveFolders.map(f => `<option value="${f.id}">${getFolderPath(f.id)}</option>`).join('');
    }

    function saveFile() {
      const id = document.getElementById('editFileId').value;
      const name = document.getElementById('fileNameInput').value.trim();
      const size = document.getElementById('fileSizeInput').value.trim();
      const driveId = document.getElementById('fileDriveSelect').value;
      const folderId = document.getElementById('fileFolderSelect').value || null;

      if (!name) return alert('请输入文件名称');

      if (id) {
        const index = files.findIndex(f => f.id === id);
        files[index] = { ...files[index], name, size, driveId, folderId };
      } else {
        files.push({ id: Date.now().toString(), name, size, driveId, folderId });
      }

      syncStorage();
      closeModal('fileModal');
    }

    function deleteFile(id) {
      if (confirm('确认删除该文件索引吗？')) {
        files = files.filter(f => f.id !== id);
        syncStorage();
      }
    }
  </script>
</body>
</html>
